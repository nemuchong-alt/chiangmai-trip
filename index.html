<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>清迈行程 · 6月21-25日</title>
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --text: #2d2d2d;
    --text-light: #888;
    --accent: #e07a5f;
    --accent-light: #fef0ec;
    --teal: #3d8b8b;
    --teal-light: #e8f4f4;
    --purple: #7b5ea7;
    --purple-light: #f3eef8;
    --yellow: #f4a259;
    --yellow-light: #fef5e7;
    --green: #5a9a6e;
    --green-light: #eaf5ec;
    --border: #eee;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding-bottom: 80px;
  }

  /* Header */
  .header {
    background: var(--card);
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
  }
  .header-sub {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }

  /* Day Tabs */
  .day-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid transparent;
    background: var(--bg);
    color: var(--text-light);
    white-space: nowrap;
  }
  .day-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .day-tab.has-content::after {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    background: var(--teal);
    border-radius: 50%;
    margin-left: 5px;
    vertical-align: middle;
  }
  .day-tab.active.has-content::after {
    background: rgba(255,255,255,0.7);
  }

  /* Day Label */
  .day-label {
    font-size: 13px;
    color: var(--text-light);
    padding: 16px 20px 8px;
    font-weight: 500;
  }

  /* Timeline */
  .timeline {
    padding: 0 16px 16px;
    position: relative;
  }

  .timeline-item {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--accent);
    position: relative;
  }
  .timeline-item.type-transport { border-left-color: var(--teal); }
  .timeline-item.type-food { border-left-color: var(--yellow); }
  .timeline-item.type-market { border-left-color: var(--purple); }
  .timeline-item.type-activity { border-left-color: var(--green); }
  .timeline-item.type-info { border-left-color: #aaa; }

  .item-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
  }
  .item-time {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .item-title {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
    line-height: 1.4;
  }
  .item-desc {
    font-size: 13px;
    color: var(--text-light);
    line-height: 1.6;
    margin-top: 4px;
  }
  .item-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    margin-right: 4px;
    margin-top: 4px;
  }
  .tag-transport { background: var(--teal-light); color: var(--teal); }
  .tag-food { background: var(--yellow-light); color: var(--yellow); }
  .tag-market { background: var(--purple-light); color: var(--purple); }
  .tag-activity { background: var(--green-light); color: var(--green); }
  .tag-info { background: #f0f0f0; color: #888; }

  /* Pending items */
  .pending-item { margin-bottom: 4px; }
  .pending-move-btn {
    display: block;
    width: calc(100% - 32px);
    margin: 4px 16px 10px;
    padding: 6px 0;
    background: var(--purple-light);
    color: var(--purple);
    border: 1.5px solid #d8c8ec;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    transition: all 0.15s;
  }
  .pending-move-btn:hover { background: #e4d4f5; }

  .empty-day {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 14px;
  }
  .empty-day svg { margin-bottom: 10px; opacity: 0.4; }

  /* Section divider */
  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 12px 16px 6px;
  }

  /* Tips */
  .tips-card {
    background: var(--green-light);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 0 16px 10px;
    border: 1px solid #d0e8d4;
  }
  .tips-card h4 {
    font-size: 14px;
    font-weight: 600;
    color: var(--green);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tips-edit-btn {
    margin-left: auto;
    font-size: 11px;
    font-weight: 500;
    color: var(--green);
    background: var(--green-light);
    border: 1px solid #b8dcc4;
    border-radius: 8px;
    padding: 1px 8px;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  .time-edit-btn {
    margin-left: auto;
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-light);
    border: 1px solid #efc7a8;
    border-radius: 8px;
    padding: 1px 8px;
    cursor: pointer;
    font-family: inherit;
    flex-shrink: 0;
  }
  .tips-card ul {
    font-size: 13px;
    color: #4a7a5a;
    padding-left: 16px;
    line-height: 1.8;
  }

  /* Prep Todo */
  .prep-todo-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: #fff;
    cursor: grab;
    user-select: none;
  }
  .prep-todo-item:last-child { border-bottom: none; }
  .prep-todo-item:active { cursor: grabbing; }
  .prep-check {
    width: 20px;
    height: 20px;
    border: 2px solid #ccc;
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 2px;
    cursor: pointer;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .prep-check.checked {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .prep-check.checked::after {
    content: '✓';
    font-size: 12px;
    color: #fff;
  }
  .prep-todo-text { flex: 1; }
  .prep-todo-text.done {
    text-decoration: line-through;
    color: #bbb;
  }
  .prep-todo-title {
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
  }
  .prep-todo-text.done .prep-todo-title { color: #bbb; }
  .prep-todo-note {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .prep-todo-text.done .prep-todo-note { color: #ddd; }
  .prep-delete {
    color: #ccc;
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .prep-delete:hover { color: #e07a5f; }

  /* Prep section */
  .prep-section {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .prep-section-header {
    padding: 10px 14px 8px;
    background: var(--bg);
  }
  .prep-section-items {
    min-height: 4px;
  }
  .prep-drag-handle {
    color: #ccc;
    font-size: 14px;
    cursor: grab;
    padding: 2px 6px;
    flex-shrink: 0;
  }
  .prep-drag-handle:active { cursor: grabbing; }
  .prep-add-inline {
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .prep-inline-input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 13px;
    color: var(--text);
    outline: none;
    padding: 2px 0;
  }
  .prep-inline-input::placeholder { color: #ccc; }
  .prep-add-form {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: #fff;
  }
  .prep-add-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .prep-add-row input {
    flex: 1;
    padding: 6px 10px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }
  .prep-add-row input:focus { border-color: var(--green); }
  .prep-add-note { width: 100%; }
  .prep-add-note textarea {
    width: 100%;
    padding: 6px 10px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 12px;
    resize: none;
    outline: none;
    font-family: inherit;
  }
  .prep-add-note textarea:focus { border-color: var(--green); }
  .prep-save-btn {
    width: 100%;
    padding: 7px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 6px;
  }
  .prep-save-btn:active { opacity: 0.8; }

  /* Edit FAB */
  .fab {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(224, 122, 95, 0.4);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }
  .fab:active { transform: scale(0.95); }

  /* Edit mode */
  .edit-panel {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    z-index: 300;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.1);
    max-height: 85dvh;
    overflow-y: auto;
  }
  .edit-panel.active { display: block; }
  .edit-panel h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
  }
  .edit-panel .form-group {
    margin-bottom: 14px;
  }
  .edit-panel label {
    font-size: 12px;
    color: var(--text-light);
    display: block;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .edit-panel input,
  .edit-panel select,
  .edit-panel textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .edit-panel input:focus,
  .edit-panel select:focus,
  .edit-panel textarea:focus {
    border-color: var(--accent);
  }
  .edit-panel textarea { resize: vertical; min-height: 60px; }
  .edit-panel .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .edit-panel .btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
  .edit-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 299;
  }
  .edit-overlay.active { display: block; }

  /* Edit item in list */
  .edit-item-row {
    background: var(--bg);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .edit-item-row span { font-size: 13px; flex: 1; }
  .edit-item-row .del-btn {
    background: none;
    border: none;
    color: #e07a5f;
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
  }

  /* Category picker */
  .category-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .cat-option {
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text-light);
    transition: all 0.15s;
  }
  .cat-option.selected { border-color: currentColor; }
  .cat-option[data-cat="transport"].selected { border-color: var(--teal); background: var(--teal-light); color: var(--teal); }
  .cat-option[data-cat="food"].selected { border-color: var(--yellow); background: var(--yellow-light); color: var(--yellow); }
  .cat-option[data-cat="market"].selected { border-color: var(--purple); background: var(--purple-light); color: var(--purple); }
  .cat-option[data-cat="activity"].selected { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .cat-option[data-cat="info"].selected { border-color: #aaa; background: #f5f5f5; color: #666; }

  /* Sync card */
  .sync-card {
    margin: 14px 16px 6px;
    padding: 14px 16px;
    background: linear-gradient(135deg, #fff9ef, #fff);
    border: 1px solid #f1ddbd;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .sync-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .sync-card h3 {
    font-size: 14px;
    font-weight: 600;
    color: #8b5e34;
    margin-bottom: 4px;
  }
  .sync-card p {
    font-size: 12px;
    line-height: 1.6;
    color: #7d6a56;
  }
  .sync-detail {
    margin-top: 4px;
    color: #99836c;
  }
  .sync-pill {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    padding: 7px 10px;
    border-radius: 999px;
    color: #7f5b39;
    background: #fff1d8;
    border: 1px solid #f0d4ab;
  }
  .sync-pill-ok {
    color: var(--green);
    background: var(--green-light);
    border-color: #cbe2d2;
  }
  .sync-pill-readonly {
    color: var(--teal);
    background: var(--teal-light);
    border-color: #cce6e6;
  }
  .sync-pill-warn {
    color: #b5543a;
    background: #fff0eb;
    border-color: #f0c9bc;
  }
  .sync-pill-loading {
    color: var(--purple);
    background: var(--purple-light);
    border-color: #dbcff0;
  }
  .sync-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .sync-btn {
    appearance: none;
    border: 1px solid #e4cdaa;
    background: #fff;
    color: #7f5b39;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sync-btn:active { opacity: 0.8; }
  .sync-file-btn {
    position: relative;
    overflow: hidden;
  }
  .sync-file-btn input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }
  .auth-note {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text-light);
    margin-bottom: 14px;
  }

  /* Source footer */
  .source-bar {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  .source-bar p {
    font-size: 11px;
    color: #bbb;
    line-height: 1.6;
  }
  .source-bar a { color: #ccc; }

  /* Day content */
  .day-content { display: none; }
  .day-content.active { display: block; }

  /* Hotel card */
  .hotel-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, var(--accent-light), #fff);
    border: 1.5px solid #f0d8d2;
    border-radius: var(--radius);
    padding: 12px 16px;
    margin: 12px 16px 4px;
  }
  .hotel-icon { font-size: 28px; flex-shrink: 0; }
  .hotel-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .hotel-addr { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .hotel-meta { font-size: 11px; color: var(--text-light); margin-top: 4px; line-height: 1.5; }

  @media (min-width: 600px) {
    .container { max-width: 560px; margin: 0 auto; }
  }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="header-top">
      <div>
        <h1>清迈 · 6月21-25日</h1>
        <div class="header-sub">5天4晚 · 共<span id="item-count">0</span>项安排</div>
      </div>
    </div>
    <div class="day-tabs" id="dayTabs"></div>
  </header>

  <section class="sync-card">
    <div class="sync-card-top">
      <div>
        <h3>协同同步</h3>
        <p id="syncStatus">当前是本地模式。</p>
        <p id="syncDetail" class="sync-detail">还没有连接共享数据。</p>
      </div>
      <div class="sync-pill" id="syncPill">本地模式</div>
    </div>
    <div class="sync-actions">
      <button class="sync-btn" id="btnQuickAdd" type="button">新增安排</button>
      <button class="sync-btn" id="btnCloudAuth" type="button">编辑登录</button>
      <button class="sync-btn" id="btnCloudRefresh" type="button">从云端刷新</button>
      <button class="sync-btn" id="btnCloudUpload" type="button">上传当前数据到云端</button>
      <button class="sync-btn" id="btnRestoreLocalBackup" type="button">恢复本机旧备份</button>
      <button class="sync-btn" id="btnExportData" type="button">导出备份</button>
      <label class="sync-btn sync-file-btn">
        导入备份
        <input id="importDataInput" type="file" accept="application/json">
      </label>
    </div>
  </section>

  <div id="authOverlay" class="edit-overlay"></div>
  <div id="authPanel" class="edit-panel" style="display:none;padding-top:20px">
    <h3 style="margin-bottom:8px">编辑登录</h3>
    <p class="auth-note">输入你们的共享编辑密码。通过后，这台设备就可以新增、删除和修改共享行程。</p>
    <div class="form-group">
      <label for="authEmail">编辑密码</label>
      <input type="password" id="authEmail" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="输入编辑密码">
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btnAuthCancel" type="button">取消</button>
      <button class="btn btn-primary" id="btnAuthSend" type="button">进入编辑</button>
    </div>
  </div>

  <div id="dayContents"></div>

  <div class="source-bar">
    <p>集市/夜市时间参考：清迈市政 tourismthailand.org chiangmai.go.th<br>
    实际营业时间可能有变动，建议出发前再确认。</p>
  </div>
</div>

<button class="fab" id="fabAdd" title="添加安排">+</button>

<!-- 迁移弹窗 -->
<div id="moveOverlay" class="edit-overlay"></div>
<div id="movePanel" class="edit-panel" style="display:none;padding-top:20px">
  <h3 id="movePanelTitle" style="margin-bottom:14px">安排到日期</h3>
  <div style="font-size:13px;color:#888;margin-bottom:14px" id="moveItemTitle"></div>
  <div class="form-group">
    <label>日期</label>
    <select id="moveDay"></select>
  </div>
  <div class="form-group">
    <label>时间</label>
    <input type="time" id="moveTime" value="09:00">
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="btnMoveCancel">取消</button>
    <button class="btn btn-primary" id="btnMoveConfirm">确定迁移</button>
  </div>
</div>

<!-- 小贴士编辑面板 -->
<div id="tipsOverlay" class="edit-overlay"></div>
<div id="tipsPanel" class="edit-panel" style="display:none;padding-top:20px">
  <h3 style="margin-bottom:6px">编辑小贴士</h3>
  <div style="font-size:13px;color:#888;margin-bottom:14px" id="tipsItemTitle"></div>
  <div id="tipsEditList" style="margin-bottom:12px"></div>
  <div style="display:flex;gap:8px;align-items:center">
    <input type="text" id="tipsNewInput" placeholder="新贴士，回车添加" style="flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;outline:none">
  </div>
  <div class="btn-row" style="margin-top:14px">
    <button class="btn btn-secondary" id="btnTipsCancel">取消</button>
    <button class="btn btn-primary" id="btnTipsSave">保存</button>
  </div>
</div>

<!-- Edit Overlay -->
<div class="edit-overlay" id="editOverlay"></div>

<!-- Edit Panel -->
<div class="edit-panel" id="editPanel">
  <h3 id="editPanelTitle">添加安排</h3>

  <div class="form-group">
    <label>日期</label>
    <select id="editDay"></select>
  </div>

  <div class="form-group" id="editPrepCatGroup" style="display:none">
    <label>分类</label>
    <select id="editPrepCat">
      <option value="toBring">需要带</option>
      <option value="toBuy">需要买</option>
    </select>
  </div>

  <div class="form-group">
    <label>时间</label>
    <input type="time" id="editTime" placeholder="如 09:00">
  </div>

  <div class="form-group">
    <label>标题</label>
    <input type="text" id="editTitle" placeholder="做什么？">
  </div>

  <div class="form-group">
    <label>类型</label>
    <div class="category-picker">
      <div class="cat-option" data-cat="transport">交通</div>
      <div class="cat-option" data-cat="food">美食</div>
      <div class="cat-option" data-cat="market">市集</div>
      <div class="cat-option" data-cat="activity">活动</div>
      <div class="cat-option selected" data-cat="info">备注</div>
    </div>
  </div>

  <div class="form-group">
    <label>备注</label>
    <textarea id="editDesc" placeholder="地点、预约方式、注意事项……"></textarea>
  </div>

  <div class="form-group">
    <label>小贴士 <span style="font-weight:400;color:#aaa;font-size:12px">（每行一条，选填）</span></label>
    <textarea id="editTips" placeholder="出机场换少量泰铢即可，市区汇率更好&#10;Grab 打车去古城，约 150 铢"></textarea>
  </div>

  <div class="form-group">
    <label>距酒店时间 <span style="font-weight:400;color:#aaa;font-size:12px">（选填，不填则自动识别地点）</span></label>
    <div style="display:flex;gap:8px">
      <input type="number" id="editWalk" placeholder="步行分钟" min="1" max="120" style="flex:1">
      <input type="number" id="editBike" placeholder="摩托分钟" min="1" max="180" style="flex:1">
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-secondary" id="btnCancel">取消</button>
    <button class="btn btn-primary" id="btnSave">保存</button>
  </div>

  <div class="section-title" style="margin-top: 20px;">已有安排</div>
  <div id="editItemList"></div>
</div>

<script src="./supabase-config.js"></script>
<script type="module" src="./app.js"></script>

</body>
</html>
