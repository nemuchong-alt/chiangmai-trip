<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>清迈行程 · 6月21-25日</title>
<style>
  :root {
    --bg: #faf9f7;
    --card: #ffffff;
    --text: #2d2d2d;
    --text-light: #888;
    --accent: #e07a5f;
    --accent-light: #fef0ec;
    --teal: #3d8b8b;
    --teal-light: #e8f4f4;
    --purple: #7b5ea7;
    --purple-light: #f3eef8;
    --yellow: #f4a259;
    --yellow-light: #fef5e7;
    --green: #5a9a6e;
    --green-light: #eaf5ec;
    --border: #eee;
    --radius: 14px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding-bottom: 80px;
  }

  /* Header */
  .header {
    background: var(--card);
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
  }
  .header-sub {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }

  /* Day Tabs */
  .day-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid transparent;
    background: var(--bg);
    color: var(--text-light);
    white-space: nowrap;
  }
  .day-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .day-tab.has-content::after {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    background: var(--teal);
    border-radius: 50%;
    margin-left: 5px;
    vertical-align: middle;
  }
  .day-tab.active.has-content::after {
    background: rgba(255,255,255,0.7);
  }

  /* Day Label */
  .day-label {
    font-size: 13px;
    color: var(--text-light);
    padding: 16px 20px 8px;
    font-weight: 500;
  }

  /* Timeline */
  .timeline {
    padding: 0 16px 16px;
    position: relative;
  }

  .timeline-item {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--accent);
    position: relative;
  }
  .timeline-item.type-transport { border-left-color: var(--teal); }
  .timeline-item.type-food { border-left-color: var(--yellow); }
  .timeline-item.type-market { border-left-color: var(--purple); }
  .timeline-item.type-activity { border-left-color: var(--green); }
  .timeline-item.type-info { border-left-color: #aaa; }

  .item-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
  }
  .item-time {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 2px 8px;
    border-radius: 10px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .item-title {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
    line-height: 1.4;
  }
  .item-desc {
    font-size: 13px;
    color: var(--text-light);
    line-height: 1.6;
    margin-top: 4px;
  }
  .item-tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    margin-right: 4px;
    margin-top: 4px;
  }
  .tag-transport { background: var(--teal-light); color: var(--teal); }
  .tag-food { background: var(--yellow-light); color: var(--yellow); }
  .tag-market { background: var(--purple-light); color: var(--purple); }
  .tag-activity { background: var(--green-light); color: var(--green); }
  .tag-info { background: #f0f0f0; color: #888; }

  /* Pending items */
  .pending-item { margin-bottom: 4px; }
  .pending-move-btn {
    display: block;
    width: calc(100% - 32px);
    margin: 4px 16px 10px;
    padding: 6px 0;
    background: var(--purple-light);
    color: var(--purple);
    border: 1.5px solid #d8c8ec;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    transition: all 0.15s;
  }
  .pending-move-btn:hover { background: #e4d4f5; }

  .empty-day {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 14px;
  }
  .empty-day svg { margin-bottom: 10px; opacity: 0.4; }

  /* Section divider */
  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 12px 16px 6px;
  }

  /* Market card */
  .market-info {
    background: var(--purple-light);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 0 16px 10px;
    border: 1px solid #e8e0f5;
  }
  .market-info h4 {
    font-size: 14px;
    font-weight: 600;
    color: var(--purple);
    margin-bottom: 4px;
  }
  .market-info p {
    font-size: 13px;
    color: #6a5a7a;
    line-height: 1.5;
  }

  /* Tips */
  .tips-card {
    background: var(--green-light);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 0 16px 10px;
    border: 1px solid #d0e8d4;
  }
  .tips-card h4 {
    font-size: 14px;
    font-weight: 600;
    color: var(--green);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tips-card ul {
    font-size: 13px;
    color: #4a7a5a;
    padding-left: 16px;
    line-height: 1.8;
  }

  /* Prep Todo */
  .prep-todo-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: #fff;
    cursor: grab;
    user-select: none;
  }
  .prep-todo-item:last-child { border-bottom: none; }
  .prep-todo-item:active { cursor: grabbing; }
  .prep-check {
    width: 20px;
    height: 20px;
    border: 2px solid #ccc;
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 2px;
    cursor: pointer;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .prep-check.checked {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .prep-check.checked::after {
    content: '✓';
    font-size: 12px;
    color: #fff;
  }
  .prep-todo-text { flex: 1; }
  .prep-todo-text.done {
    text-decoration: line-through;
    color: #bbb;
  }
  .prep-todo-title {
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
  }
  .prep-todo-text.done .prep-todo-title { color: #bbb; }
  .prep-todo-note {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }
  .prep-todo-text.done .prep-todo-note { color: #ddd; }
  .prep-delete {
    color: #ccc;
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .prep-delete:hover { color: #e07a5f; }

  /* Prep section */
  .prep-section {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .prep-section-header {
    padding: 10px 14px 8px;
    background: var(--bg);
  }
  .prep-section-items {
    min-height: 4px;
  }
  .prep-drag-handle {
    color: #ccc;
    font-size: 14px;
    cursor: grab;
    padding: 2px 6px;
    flex-shrink: 0;
  }
  .prep-drag-handle:active { cursor: grabbing; }
  .prep-add-inline {
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .prep-inline-input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 13px;
    color: var(--text);
    outline: none;
    padding: 2px 0;
  }
  .prep-inline-input::placeholder { color: #ccc; }
  .prep-add-form {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: #fff;
  }
  .prep-add-row { display: flex; gap: 8px; margin-bottom: 6px; }
  .prep-add-row input {
    flex: 1;
    padding: 6px 10px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
  }
  .prep-add-row input:focus { border-color: var(--green); }
  .prep-add-note { width: 100%; }
  .prep-add-note textarea {
    width: 100%;
    padding: 6px 10px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 12px;
    resize: none;
    outline: none;
    font-family: inherit;
  }
  .prep-add-note textarea:focus { border-color: var(--green); }
  .prep-save-btn {
    width: 100%;
    padding: 7px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 6px;
  }
  .prep-save-btn:active { opacity: 0.8; }

  /* Edit FAB */
  .fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(224, 122, 95, 0.4);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }
  .fab:active { transform: scale(0.95); }

  /* Edit mode */
  .edit-panel {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 40px;
    z-index: 300;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.1);
    max-height: 85dvh;
    overflow-y: auto;
  }
  .edit-panel.active { display: block; }
  .edit-panel h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
  }
  .edit-panel .form-group {
    margin-bottom: 14px;
  }
  .edit-panel label {
    font-size: 12px;
    color: var(--text-light);
    display: block;
    margin-bottom: 4px;
    font-weight: 500;
  }
  .edit-panel input,
  .edit-panel select,
  .edit-panel textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .edit-panel input:focus,
  .edit-panel select:focus,
  .edit-panel textarea:focus {
    border-color: var(--accent);
  }
  .edit-panel textarea { resize: vertical; min-height: 60px; }
  .edit-panel .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .edit-panel .btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
  .edit-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 299;
  }
  .edit-overlay.active { display: block; }

  /* Edit item in list */
  .edit-item-row {
    background: var(--bg);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .edit-item-row span { font-size: 13px; flex: 1; }
  .edit-item-row .del-btn {
    background: none;
    border: none;
    color: #e07a5f;
    font-size: 16px;
    cursor: pointer;
    padding: 4px 8px;
  }

  /* Category picker */
  .category-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .cat-option {
    padding: 6px 12px;
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text-light);
    transition: all 0.15s;
  }
  .cat-option.selected { border-color: currentColor; }
  .cat-option[data-cat="transport"].selected { border-color: var(--teal); background: var(--teal-light); color: var(--teal); }
  .cat-option[data-cat="food"].selected { border-color: var(--yellow); background: var(--yellow-light); color: var(--yellow); }
  .cat-option[data-cat="market"].selected { border-color: var(--purple); background: var(--purple-light); color: var(--purple); }
  .cat-option[data-cat="activity"].selected { border-color: var(--green); background: var(--green-light); color: var(--green); }
  .cat-option[data-cat="info"].selected { border-color: #aaa; background: #f5f5f5; color: #666; }

  /* Source footer */
  .source-bar {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }
  .source-bar p {
    font-size: 11px;
    color: #bbb;
    line-height: 1.6;
  }
  .source-bar a { color: #ccc; }

  /* Day content */
  .day-content { display: none; }
  .day-content.active { display: block; }

  /* Hotel card */
  .hotel-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, var(--accent-light), #fff);
    border: 1.5px solid #f0d8d2;
    border-radius: var(--radius);
    padding: 12px 16px;
    margin: 12px 16px 4px;
  }
  .hotel-icon { font-size: 28px; flex-shrink: 0; }
  .hotel-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .hotel-addr { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .hotel-meta { font-size: 11px; color: var(--text-light); margin-top: 4px; line-height: 1.5; }

  @media (min-width: 600px) {
    .container { max-width: 560px; margin: 0 auto; }
  }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="header-top">
      <div>
        <h1>清迈 · 6月21-25日</h1>
        <div class="header-sub">5天4晚 · 共<span id="item-count">0</span>项安排</div>
      </div>
    </div>
    <div class="day-tabs" id="dayTabs"></div>
  </header>

  <div id="dayContents"></div>

  <div class="source-bar">
    <p>集市/夜市时间参考：清迈市政 tourismthailand.org chiangmai.go.th<br>
    实际营业时间可能有变动，建议出发前再确认。</p>
  </div>
</div>

<button class="fab" id="fabAdd" title="添加安排">+</button>

<!-- 迁移弹窗 -->
<div id="moveOverlay" class="edit-overlay"></div>
<div id="movePanel" class="edit-panel" style="display:none;padding-top:20px">
  <h3 style="margin-bottom:14px">安排到日期</h3>
  <div style="font-size:13px;color:#888;margin-bottom:14px" id="moveItemTitle"></div>
  <div class="form-group">
    <label>日期</label>
    <select id="moveDay"></select>
  </div>
  <div class="form-group">
    <label>时间</label>
    <input type="time" id="moveTime" value="09:00">
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary" id="btnMoveCancel">取消</button>
    <button class="btn btn-primary" id="btnMoveConfirm">确定迁移</button>
  </div>
</div>

<!-- Edit Overlay -->
<div class="edit-overlay" id="editOverlay"></div>

<!-- Edit Panel -->
<div class="edit-panel" id="editPanel">
  <h3 id="editPanelTitle">添加安排</h3>

  <div class="form-group">
    <label>日期</label>
    <select id="editDay"></select>
  </div>

  <div class="form-group" id="editPrepCatGroup" style="display:none">
    <label>分类</label>
    <select id="editPrepCat">
      <option value="toBring">需要带</option>
      <option value="toBuy">需要买</option>
    </select>
  </div>

  <div class="form-group">
    <label>时间</label>
    <input type="time" id="editTime" placeholder="如 09:00">
  </div>

  <div class="form-group">
    <label>标题</label>
    <input type="text" id="editTitle" placeholder="做什么？">
  </div>

  <div class="form-group">
    <label>类型</label>
    <div class="category-picker">
      <div class="cat-option" data-cat="transport">交通</div>
      <div class="cat-option" data-cat="food">美食</div>
      <div class="cat-option" data-cat="market">市集</div>
      <div class="cat-option" data-cat="activity">活动</div>
      <div class="cat-option selected" data-cat="info">备注</div>
    </div>
  </div>

  <div class="form-group">
    <label>备注</label>
    <textarea id="editDesc" placeholder="地点、预约方式、注意事项……"></textarea>
  </div>

  <div class="form-group">
    <label>小贴士 <span style="font-weight:400;color:#aaa;font-size:12px">（每行一条，选填）</span></label>
    <textarea id="editTips" placeholder="出机场换少量泰铢即可，市区汇率更好&#10;Grab 打车去古城，约 150 铢"></textarea>
  </div>

  <div class="form-group">
    <label>距酒店时间 <span style="font-weight:400;color:#aaa;font-size:12px">（选填，不填则自动识别地点）</span></label>
    <div style="display:flex;gap:8px">
      <input type="number" id="editWalk" placeholder="步行分钟" min="1" max="120" style="flex:1">
      <input type="number" id="editBike" placeholder="摩托分钟" min="1" max="180" style="flex:1">
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-secondary" id="btnCancel">取消</button>
    <button class="btn btn-primary" id="btnSave">保存</button>
  </div>

  <div class="section-title" style="margin-top: 20px;">已有安排</div>
  <div id="editItemList"></div>
</div>

<script>
// ─── 数据模型 ───
const DAYS = [
  { date: 'prep', label: '行前准备', weekday: '' },
  { date: '2026-06-21', label: '6月21日', weekday: '周日' },
  { date: '2026-06-22', label: '6月22日', weekday: '周一' },
  { date: '2026-06-23', label: '6月23日', weekday: '周二' },
  { date: '2026-06-24', label: '6月24日', weekday: '周三' },
  { date: '2026-06-25', label: '6月25日', weekday: '周四' },
  { date: 'pending', label: 'P人待定', weekday: '' },
];

const CATEGORY_MAP = {
  transport: { label: '交通', color: 'var(--teal)', bg: 'var(--teal-light)', tag: 'tag-transport' },
  food:     { label: '美食', color: 'var(--yellow)', bg: 'var(--yellow-light)', tag: 'tag-food' },
  market:   { label: '市集', color: 'var(--purple)', bg: 'var(--purple-light)', tag: 'tag-market' },
  activity: { label: '运动', color: 'var(--green)', bg: 'var(--green-light)', tag: 'tag-activity' },
  info:     { label: '备注', color: '#888', bg: '#f0f0f0', tag: 'tag-info' },
};

// 默认行程数据（网站模板的一部分）
const DEFAULT_ITINERARY = {
  '2026-06-21': [
    { time: '10:10', title: 'MU205 上海 → 清迈', category: 'transport', desc: '上海浦东 T1 出发，预计 13:25 抵达清迈国际机场', dist: { bike: 15 }, tips: [
      '出机场换少量泰铢够当天用即可，市区汇率更好',
      'Grab 或 Bolt 打车去古城，约 150-200 铢',
    ]},

// 读取：优先用 localStorage，缺省值则用默认值
function loadItinerary() {
  try {
    const saved = localStorage.getItem('chiangmai_itinerary');
    if (saved) {
      const parsed = JSON.parse(saved);
      // 合并：用户数据 + 默认值里新增的天（如有）
      const merged = { ...DEFAULT_ITINERARY };
      Object.keys(parsed).forEach(date => {
        merged[date] = parsed[date];
      });
      return merged;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
}

// 保存到 localStorage

    localStorage.setItem('chiangmai_itinerary', JSON.stringify(itinerary));

}

// 每个地点到酒店的时间，walk=步行分钟，bike=摩托车分钟
// 30分钟以内步行两者都显示，超过只显示摩托车时间
const DIST_FROM_HOTEL = {
  airport:     { walk: null, bike: 12, label: '机场' },
  station:     { walk: null, bike: 18, label: '火车站' },
  thatphae:    { walk: 8,  bike: 5,  label: '塔佩门' },
  sundaymarket:{ walk: 8,  bike: 5,  label: '周日夜市' },
  nightbazaar: { walk: 25, bike: 10, label: 'Night Bazaar' },
  northgate:   { walk: 12, bike: 8,  label: 'North Gate' },
  elephant:    { walk: null, bike: 50, label: '大象营' },
  bluetemple:  { walk: null, bike: 30, label: '蓝庙' },
  waterfall:   { walk: null, bike: 45, label: '粘粘瀑布' },
};

function formatDist(dist) {
  if (!dist) return '';
  if (dist.walk && dist.bike) {
    return `步行 ${dist.walk} 分钟 / 摩托 ${dist.bike} 分钟`;
  }
  return `摩托 ${dist.bike} 分钟`;
}

// 根据行程描述匹配距离
function guessDist(item) {
  const t = item.title + (item.desc || '');
  const d = item.dist;
  if (d) return formatDist(d);
  // 关键词匹配
  if (/机场|MU205|MU206/.test(t)) return formatDist(DIST_FROM_HOTEL.airport);
  if (/火车站|train/.test(t)) return formatDist(DIST_FROM_HOTEL.station);
  if (/Tha Phae|塔佩门|周日夜市|Sunday Walking/.test(t)) return formatDist(DIST_FROM_HOTEL.sundaymarket);
  if (/Night Bazaar|night.?bazaar/i.test(t)) return formatDist(DIST_FROM_HOTEL.nightbazaar);
  if (/North Gate|爵士|Jazz/.test(t)) return formatDist(DIST_FROM_HOTEL.northgate);
  if (/大象营|Elephant/.test(t)) return formatDist(DIST_FROM_HOTEL.elephant);
  if (/蓝庙|Wat Rong|Bluetemple/i.test(t)) return formatDist(DIST_FROM_HOTEL.bluetemple);
  if (/瀑布|Waterfall/.test(t)) return formatDist(DIST_FROM_HOTEL.waterfall);
  return '';
}

// 每天概览距离：当天第一个行程 → 酒店（去程），最后一个行程 → 酒店（回程）
function getDayDistSummary(items) {
  if (!items || items.length === 0) return '';
  const sorted = [...items].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  const first = sorted[0];
  const last  = sorted[sorted.length - 1];
  const firstDist = guessDist(first);
  const lastDist  = guessDist(last);
  if (!firstDist && !lastDist) return '';
  if (first === last) return firstDist ? `距酒店 ${firstDist}` : '';
  const parts = [];
  if (firstDist) parts.push(`去程 ${firstDist}`);
  if (lastDist)  parts.push(`回程 ${lastDist}`);
  return parts.join(' · ');
}

function render() {
  const tabs = document.getElementById('dayTabs');
  const contents = document.getElementById('dayContents');
  tabs.innerHTML = '';
  contents.innerHTML = '';

  DAYS.forEach((day, i) => {
    const items = itinerary[day.date] || [];
    const hasContent = items.length > 0;

    // Tab
    const tab = document.createElement('div');
    tab.className = 'day-tab' + (i === 0 ? ' active' : '') + (hasContent ? ' has-content' : '');
    tab.textContent = day.date === 'pending' ? 'P人待定' : (day.date === 'prep' ? '行前准备' : `${day.label.replace('6月', '')} ${day.weekday}`);
    tab.dataset.date = day.date;
    tab.addEventListener('click', () => switchDay(day.date));
    tabs.appendChild(tab);

    // Content
    const section = document.createElement('div');
    section.className = 'day-content' + (i === 0 ? ' active' : '');
    section.id = `day-${day.date}`;
    section.innerHTML = renderDayContent(day, items);
    contents.appendChild(section);
  });

  updateItemCount();
  updateEditItemList();
}

function switchDay(date) {
  document.querySelectorAll('.day-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.date === date);
  });
  document.querySelectorAll('.day-content').forEach(c => {
    c.classList.toggle('active', c.id === `day-${date}`);
  });
  document.querySelectorAll('.day-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.date === date);
  });
  // Re-evaluate active tab
  document.querySelectorAll('.day-content').forEach(c => {
    const isActive = c.id === `day-${date}`;
    c.classList.toggle('active', isActive);
  });
}

function updateItemCount() {
  let total = 0;
  Object.values(itinerary).forEach(arr => total += arr.length);
  document.getElementById('item-count').textContent = total;

  // Update tab dots
  DAYS.forEach(day => {
    const items = itinerary[day.date] || [];
    const tab = document.querySelector(`.day-tab[data-date="${day.date}"]`);
    if (tab) tab.classList.toggle('has-content', items.length > 0);
  });
}

    .sort((a, b) => (a.time || '').localeCompare(b.time || ''))
    .map((item, i) => {
      const cat = CATEGORY_MAP[item.category] || CATEGORY_MAP.info;
      return `<div class="edit-item-row">
        <span>${item.time || '—'} ${item.title}</span>
        <button class="del-btn" data-date="${selectedEditDate}" data-index="${i}" title="删除">×</button>
      </div>`;
    }).join('');

  list.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.date;
      const idx = parseInt(btn.dataset.index);
      itinerary[d].splice(idx, 1);
      saveItinerary();
      render();
    });
  });
}

function saveItem() {
  const date = document.getElementById('editDay').value;
  const time = document.getElementById('editTime').value;
  const title = document.getElementById('editTitle').value.trim();
  const desc = document.getElementById('editDesc').value.trim();

  if (!title) {
    document.getElementById('editTitle').focus();
    return;
  }

  // 行前准备 → 写入 prepTodos（需选分类）
  if (date === 'prep') {
    const title = document.getElementById('editTitle').value.trim();
    const note = document.getElementById('editDesc').value.trim();
    const cat = document.getElementById('editPrepCat').value; // 'toBring' | 'toBuy'
    if (!title) {
      document.getElementById('editTitle').focus();
      return;
    }
    prepTodos[cat].push({ title, note, done: false });
    savePrepTodos();
    document.getElementById('editTitle').value = '';
    document.getElementById('editDesc').value = '';
    render();
    openEditPanel();
    return;
  }

  if (!itinerary[date]) itinerary[date] = [];
  const tipsRaw = document.getElementById('editTips').value.trim();
  const tips = tipsRaw ? tipsRaw.split('\n').map(t => t.trim()).filter(Boolean) : [];
  const walk = parseInt(document.getElementById('editWalk').value);
  const bike = parseInt(document.getElementById('editBike').value);
  const dist = (walk || bike) ? { walk: walk || null, bike: bike || null } : undefined;
  itinerary[date].push({ time, title, category: currentEditCat, desc, tips: tips.length ? tips : undefined, dist });
  saveItinerary();

  // Reset form
  document.getElementById('editTime').value = '';
  document.getElementById('editTitle').value = '';
  document.getElementById('editDesc').value = '';
  document.getElementById('editTips').value = '';
  document.getElementById('editWalk').value = '';
  document.getElementById('editBike').value = '';

  render();
  // Re-open panel to show updated list
  openEditPanel();
}

// ─── 事件绑定 ───
document.getElementById('fabAdd').addEventListener('click', openEditPanel);
document.getElementById('editOverlay').addEventListener('click', closeEditPanel);
document.getElementById('btnCancel').addEventListener('click', closeEditPanel);
document.getElementById('btnSave').addEventListener('click', saveItem);

document.querySelectorAll('.cat-option').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.cat-option').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    currentEditCat = opt.dataset.cat;
  });
});

document.getElementById('editDay').addEventListener('change', e => {
  selectedEditDate = e.target.value;
  const isPrep = selectedEditDate === 'prep';
  document.getElementById('editPrepCatGroup').style.display = isPrep ? 'block' : 'none';
  if (isPrep) {
    document.getElementById('editTime').parentElement.style.display = 'none';
    document.getElementById('editWalk').parentElement.style.display = 'none';
    document.getElementById('editBike').parentElement.style.display = 'none';
    document.getElementById('editTips').parentElement.style.display = 'none';
    document.querySelector('.category-picker').style.display = 'none';
  } else {
    document.getElementById('editTime').parentElement.style.display = '';
    document.getElementById('editWalk').parentElement.style.display = '';
    document.getElementById('editBike').parentElement.style.display = '';
    document.getElementById('editTips').parentElement.style.display = '';
    document.querySelector('.category-picker').style.display = '';
  }
  updateEditItemList();
});

// 行前准备页面事件（动态渲染，需每次 render 后重新绑定）
document.addEventListener('click', e => {
  // 复选框切换
  if (e.target.classList.contains('prep-check')) {
    const cat = e.target.dataset.cat;
    const i = parseInt(e.target.dataset.i);
    prepTodos[cat][i].done = !prepTodos[cat][i].done;
    savePrepTodos();
    render();
  }
  // 删除按钮
  if (e.target.classList.contains('prep-delete')) {
    const cat = e.target.dataset.cat;
    const i = parseInt(e.target.dataset.i);
    prepTodos[cat].splice(i, 1);
    savePrepTodos();
    render();
  }
});

// 拖拽排序
document.addEventListener('dragstart', e => {
  if (e.target.classList.contains('prep-todo-item')) {
    e.dataTransfer.setData('text/plain', JSON.stringify({
      cat: e.target.dataset.cat,
      i: parseInt(e.target.dataset.i),
    }));
    e.target.style.opacity = '0.4';
  }
});
document.addEventListener('dragend', e => {
  if (e.target.classList.contains('prep-todo-item')) {
    e.target.style.opacity = '';
  }
});
document.addEventListener('dragover', e => {
  const item = e.target.closest('.prep-todo-item');
  if (item) {
    e.preventDefault();
    item.style.background = 'var(--green-light)';
  }
});
document.addEventListener('dragleave', e => {
  const item = e.target.closest('.prep-todo-item');
  if (item) item.style.background = '';
});
document.addEventListener('drop', e => {
  const targetItem = e.target.closest('.prep-todo-item');
  if (!targetItem) return;
  e.preventDefault();
  targetItem.style.background = '';
  try {
    const { cat, i } = JSON.parse(e.dataTransfer.getData('text/plain'));
    const toCat = targetItem.dataset.cat;
    const toI = parseInt(targetItem.dataset.i);
    if (cat !== toCat) return; // 只允许同分类内拖动
    const [moved] = prepTodos[cat].splice(i, 1);
    prepTodos[cat].splice(toI, 0, moved);
    savePrepTodos();
    render();
  } catch (_) {}
});

// 行前准备内联输入框回车添加
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('prep-inline-input')) {
    const input = e.target;
    const title = input.value.trim();
    if (!title) return;
    const cat = input.dataset.cat;
    prepTodos[cat].push({ title, note: '', done: false });
    savePrepTodos();
    input.value = '';
    render();
  }
});

// ─── 待定事项迁移 ───
let pendingMoveIndex = null;

function openMovePanel(itemIndex) {
  pendingMoveIndex = itemIndex;
  const item = itinerary.pending[itemIndex];
  document.getElementById('moveItemTitle').textContent = item ? item.title : '';
  document.getElementById('moveTime').value = item && item.time ? item.time : '09:00';

  // 填充日期下拉
  const daySelect = document.getElementById('moveDay');
  const realDays = DAYS.filter(d => d.date !== 'prep' && d.date !== 'pending');
  daySelect.innerHTML = realDays.map(d =>
    `<option value="${d.date}">${d.label} ${d.weekday}</option>`
  ).join('');

  document.getElementById('moveOverlay').classList.add('active');
  document.getElementById('movePanel').style.display = 'block';
  document.getElementById('moveTime').focus();
}

function closeMovePanel() {
  document.getElementById('moveOverlay').classList.remove('active');
  document.getElementById('movePanel').style.display = 'none';
  pendingMoveIndex = null;
}

document.addEventListener('click', e => {
  if (e.target.classList.contains('pending-move-btn')) {
    const i = parseInt(e.target.dataset.i);
    openMovePanel(i);
  }
  if (e.target.id === 'btnMoveCancel' || e.target.id === 'moveOverlay') {
    closeMovePanel();
  }
  if (e.target.id === 'btnMoveConfirm') {
    if (pendingMoveIndex === null) return;
    const targetDate = document.getElementById('moveDay').value;
    const targetTime = document.getElementById('moveTime').value;
    const item = itinerary.pending[pendingMoveIndex];
    if (!item) { closeMovePanel(); return; }
    // 写入目标日期
    if (!itinerary[targetDate]) itinerary[targetDate] = [];
    itinerary[targetDate].push({
      time: targetTime,
      title: item.title,
      category: item.category,
      desc: item.desc,
      tips: item.tips,
    });
    // 从待定中删除
    itinerary.pending.splice(pendingMoveIndex, 1);
    saveItinerary();
    closeMovePanel();
    render();
  }
});

// ─── 时间合理性检查提示 ───
function checkSchedule(date) {
  const items = itinerary[date];
  if (!items || items.length < 2) return '';
  const sorted = [...items].filter(i => i.time).sort((a, b) => a.time.localeCompare(b.time));
  if (sorted.length < 2) return '';

  const warnings = [];
  for (let i = 1; i < sorted.length; i++) {
    const [h1, m1] = sorted[i-1].time.split(':').map(Number);
    const [h2, m2] = sorted[i].time.split(':').map(Number);
    const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (diff < 30) {
      warnings.push(`⚠️ ${sorted[i-1].title} → ${sorted[i].title} 之间只隔了 ${diff} 分钟，可能太赶。`);
    }
  }
  return warnings.join('<br>');
}

// ─── 初始化 ───
render();
